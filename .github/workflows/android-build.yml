name: Build Android App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Extract WarpScout tar.gz and move to assets
      run: |
        tar -xzf warpscout_0.16.0_android_arm64.tar.gz
        mkdir -p app/src/main/assets
        mv warpscout app/src/main/assets/warpscout

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # gradlew မလိုဘဲ တိုက်ရိုက် run နိုင်ရန် gradle ကို setup လုပ်ခြင်း
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # ./gradlew အစား gradle ကို တိုက်ရိုက် အသုံးပြုခြင်း
    - name: Build Release APK
      run: gradle assembleRelease 

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: warpscout-app
        path: app/build/outputs/apk/release/*.apk
